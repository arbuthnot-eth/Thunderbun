name: TWA Play Store Tests

on:
  push:
    paths:
      - 'templates/ski-dapp/**'
  pull_request:
    paths:
      - 'templates/ski-dapp/**'

defaults:
  run:
    working-directory: templates/ski-dapp

jobs:
  test:
    name: Play Store validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: bun install --frozen-lockfile || bun install

      - name: Run Play Store tests
        run: bun run test:playstore

      - name: TypeScript type check
        run: bun run tsc -p tsconfig.json --noEmit
