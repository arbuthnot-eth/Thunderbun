<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0A1423" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="description" content="The Sui-native framework for launching dApps. Built-in SDKs, Cloudflare Agents, PWA-ready." />
    <link rel="icon" type="image/svg+xml" href="/icons/tbai.svg" />
    <link rel="apple-touch-icon" href="/icons/pwa-192x192.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <title>Thunderbun — Web4 dApp Portal</title>
    <style>
      #splash{position:fixed;inset:0;z-index:99999;display:flex;align-items:center;justify-content:center;background:#09090F;transition:opacity .3s ease}
      #splash.fade{opacity:0;pointer-events:none}
      #splash img{width:60px;height:60px;border-radius:14px;animation:splash-glow 1.4s ease-in-out infinite;filter:drop-shadow(0 0 16px rgba(255,255,255,0.5))}
      @keyframes splash-glow{0%,100%{opacity:.65;transform:scale(.95);filter:drop-shadow(0 0 14px rgba(255,255,255,0.4))}50%{opacity:1;transform:scale(1);filter:drop-shadow(0 0 24px rgba(255,255,255,0.7))}}
      #app{opacity:0;transition:opacity .2s ease}
      #app.ready{opacity:1}
    </style>
  </head>
  <body>
    <div id="splash">
      <img src="/icons/tbai.svg" alt="" width="60" height="60" />
    </div>
    <div id="app">
      <button id="sidebar-dock-toggle" aria-label="Open navigation">
        <img src="/icons/tbai.svg" alt="" width="20" height="20" />
        <span>Menu</span>
      </button>
      <div id="sidebar-backdrop" aria-hidden="true"></div>

      <!-- Sidebar -->
      <aside id="sidebar">
        <div class="sidebar-logo">
          <img class="sidebar-logo-icon" src="/icons/tbai.svg" alt="Thunderbun" width="60" height="60" />
          <span class="sidebar-logo-name" id="app-title">Thunderbun</span>
          <button id="sidebar-close" class="sidebar-close" aria-label="Close navigation">✕</button>
        </div>

        <!-- Navigation -->
        <div class="nav-scroll">
          <div class="nav-section">
            <div class="nav-section-label">Core</div>
            <div id="nav-core"></div>
          </div>
          <div class="nav-section">
            <div class="nav-section-label">Ecosystem</div>
            <div id="nav-ecosystem"></div>
          </div>
          <div class="nav-section">
            <div class="nav-section-label">More</div>
            <div id="nav-more"></div>
          </div>
        </div>

        <div class="sidebar-footer">
          Built with <a href="https://github.com/arbuthnot-eth/thunderbun" target="_blank">Thunderbun</a>
        </div>
      </aside>

      <!-- Main -->
      <main id="main-content"></main>

      <!-- .SKI wallet widget — one-button overlay -->
      <div class="wallet-widget" id="wallet-widget">
        <div id="wk-widget"></div>
        <button class="wallet-ski-btn" id="wallet-ski-btn" style="display:none" aria-label=".SKI wallet"></button>
        <div id="wallet-menu-root"></div>
      </div>
      <div id="ski-modal"></div>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
