# Cloudflare Workers config for Thunderbun sui-twa
# Docs: https://developers.cloudflare.com/workers/
#       https://developers.cloudflare.com/workers/static-assets/
#       https://github.com/cloudflare/agents
#
# ─── First-time setup ─────────────────────────────────────────────────────────
#   npm install -g wrangler          # or: bun add -g wrangler
#   wrangler login                   # authenticate with your Cloudflare account
#   bun run build                    # build the Vite PWA into dist/
#   wrangler deploy                  # deploys Worker + static assets
#
# Your app will be live at:
#   https://thunderbun.<your-account>.workers.dev
#
# Add a custom domain in the Cloudflare Dashboard:
#   Workers & Pages → thunderbun → Triggers → Custom domains
# ──────────────────────────────────────────────────────────────────────────────

name            = "thunderbun"
account_id      = "78d00354fe2d2f18838c04823c9d58f5"
main            = "src/worker.ts"
compatibility_date  = "2026-02-19"
compatibility_flags = ["nodejs_compat"]

# ─── Static assets (Vite build output) ───────────────────────────────────────
# Workers serves dist/ as static files. Requests to non-existent paths fall
# through to index.html so the SPA router handles them client-side.
[assets]
directory            = "dist"
not_found_handling   = "single-page-application"
binding              = "ASSETS"

# ─── Environment variables ───────────────────────────────────────────────────
# Plain vars go here; secrets use: wrangler secret put VAR_NAME
[vars]
NETWORK = "testnet"
# Optional Base gas sponsor vars:
# BASE_SPONSOR_RPC_URL = "https://sepolia.base.org"
# BASE_SPONSOR_AMOUNT_WEI = "200000000000000"
# BASE_SPONSOR_COOLDOWN_MS = "1800000"
# Optional Ika invisible deposit vars:
# IKA_BASE_RPC_URL = "https://sepolia.base.org"
# IKA_POLICY_MAX_BURN_RAW = "5000000000"
# IKA_POLICY_SESSION_MS = "0"
# IKA_SCAN_LOOKBACK_BLOCKS = "60000"
# IKA_MIN_BASE_CONFIRMATIONS = "2"
# IKA_MIN_DEPOSIT_RAW = "1000"
# IKA_AUTO_SETTLE = "true"
# IKA_MINT_GAS_BUDGET = "50000000"
# Secret required (set via `wrangler secret put IKA_DWALLET_MASTER_SEED`)
# Optional secret: `wrangler secret put SPONSOR_PRIVATE_KEY` for auto-mint signing

# ─── .SKI Session Agent (Durable Object) ────────────────────────────────────
# Uncomment to enable server-side .SKI session persistence and SuiNS lookups.
# First deploy with: npx wrangler deploy
#
# [[durable_objects.bindings]]
# name = "SESSION_AGENT"
# class_name = "SessionAgent"
#
# [[migrations]]
# tag = "v1"
# new_sqlite_classes = ["SessionAgent"]

# Production overrides
[env.production]
name = "thunderbun"
routes = [
  { pattern = "thunderbun.ai", custom_domain = true },
  { pattern = "www.thunderbun.ai", custom_domain = true },
]
[env.production.vars]
NETWORK = "mainnet"
# Optional Base gas sponsor vars:
# BASE_SPONSOR_RPC_URL = "https://mainnet.base.org"
# BASE_SPONSOR_AMOUNT_WEI = "200000000000000"
# BASE_SPONSOR_COOLDOWN_MS = "1800000"
# Optional Ika invisible deposit vars:
# IKA_BASE_RPC_URL = "https://mainnet.base.org"
# IKA_POLICY_MAX_BURN_RAW = "5000000000"
# IKA_POLICY_SESSION_MS = "0"
# IKA_SCAN_LOOKBACK_BLOCKS = "60000"
# IKA_MIN_BASE_CONFIRMATIONS = "2"
# IKA_MIN_DEPOSIT_RAW = "1000"
# IKA_AUTO_SETTLE = "true"
# IKA_MINT_GAS_BUDGET = "50000000"

# Preview / staging
[env.preview]
name = "thunderbun-preview"
[env.preview.vars]
NETWORK = "testnet"
