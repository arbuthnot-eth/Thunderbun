<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#4DA2FF" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="description" content="Live SDK playground for the Sui ecosystem — connect, interact, view source, and build." />
    <link rel="icon" type="image/png" href="/icons/thunderbun-logo.png" />
    <link rel="apple-touch-icon" href="/icons/pwa-192x192.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <title>Thunderbun — Sui SDK Playground</title>
    <style>
      #splash{position:fixed;inset:0;z-index:99999;display:flex;align-items:center;justify-content:center;background:#12151a;transition:opacity .3s ease}
      #splash.fade{opacity:0;pointer-events:none}
      #splash img{width:64px;height:64px;animation:pulse 1.2s ease-in-out infinite}
      @keyframes pulse{0%,100%{opacity:.6;transform:scale(.95)}50%{opacity:1;transform:scale(1)}}
      #app{opacity:0;transition:opacity .2s ease}
      #app.ready{opacity:1}
    </style>
  </head>
  <body>
    <div id="splash">
      <img src="/icons/thunderbun-logo.png" alt="" width="64" height="64" />
    </div>
    <div id="app">
      <!-- Sidebar -->
      <aside id="sidebar">
        <div class="sidebar-logo">
          <img class="sidebar-logo-icon" src="/icons/thunderbun-logo.png" alt="Thunderbun" width="32" height="32" />
          <span class="sidebar-logo-name" id="app-title">Thunderbun</span>
        </div>

        <!-- Wallet card -->
        <div class="wallet-card" id="wallet-card" onclick="window.__app?.showSection('home')">
          <div id="wallet-disconnected">
            <span class="wallet-label">
              <span class="wallet-status-dot disconnected"></span>
              Not connected
            </span>
          </div>
          <div id="wallet-connected" class="hidden">
            <span class="wallet-label connected">
              <span class="wallet-status-dot connected"></span>
              Connected
            </span>
            <div class="wallet-address" id="wallet-address"></div>
            <div class="wallet-balance" id="wallet-balance"></div>
          </div>
        </div>

        <!-- Navigation -->
        <div class="nav-scroll">
          <div class="nav-section">
            <div class="nav-section-label">Core</div>
            <div id="nav-core"></div>
          </div>
          <div class="nav-section">
            <div class="nav-section-label">Ecosystem</div>
            <div id="nav-ecosystem"></div>
          </div>
          <div class="nav-section">
            <div class="nav-section-label">More</div>
            <div id="nav-more"></div>
          </div>
        </div>

        <div class="sidebar-footer">
          Built with <a href="https://github.com/arbuthnot-eth/thunderbun" target="_blank">Thunderbun</a>
        </div>
      </aside>

      <!-- Main -->
      <main id="main-content"></main>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
