<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#4DA2FF" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="description" content="Sui-native PWA built with ThunderBun" />
    <link rel="icon" type="image/svg+xml" href="/icons/icon.svg" />
    <link rel="apple-touch-icon" href="/icons/pwa-192x192.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <title>Sui App</title>
  </head>
  <body>
    <div id="app">
      <!-- Sidebar -->
      <aside id="sidebar">
        <div class="sidebar-logo">
          <div class="sidebar-logo-icon">S</div>
          <span class="sidebar-logo-name" id="app-title">Sui App</span>
        </div>

        <!-- Wallet card -->
        <div class="wallet-card" id="wallet-card" onclick="window.__app?.showSection('home')">
          <div id="wallet-disconnected">
            <span class="wallet-label">
              <span class="wallet-status-dot disconnected"></span>
              Not connected
            </span>
          </div>
          <div id="wallet-connected" class="hidden">
            <span class="wallet-label connected">
              <span class="wallet-status-dot connected"></span>
              Connected
            </span>
            <div class="wallet-address" id="wallet-address"></div>
            <div class="wallet-balance" id="wallet-balance"></div>
          </div>
        </div>

        <!-- Navigation -->
        <div class="nav-scroll">
          <div class="nav-section">
            <div class="nav-section-label">Core</div>
            <div id="nav-core"></div>
          </div>
          <div class="nav-section">
            <div class="nav-section-label">Ecosystem</div>
            <div id="nav-ecosystem"></div>
          </div>
          <div class="nav-section">
            <div class="nav-section-label">More</div>
            <div id="nav-more"></div>
          </div>
        </div>

        <div class="sidebar-footer">
          Built with <a href="https://github.com/arbuthnot-eth/thunderbun" target="_blank">ThunderBun</a>
        </div>
      </aside>

      <!-- Main -->
      <main id="main-content"></main>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
